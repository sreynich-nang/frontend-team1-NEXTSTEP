<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Next Step</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      * {
        font-family: Arial, Helvetica, sans-serif;
      }

      /* Hero */
      .hero {
        height: 420px;
        background: url("../../assets/images/contact_background.png") center
          center/cover no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .hero h1 {
        color: white;
        font-size: 60px;
        font-weight: bold;
      }

      /* Contact Info */
      .contact-card {
        text-align: center;
      }

      .icon-box {
        width: 90px;
        height: 90px;
        border: 1px solid #999;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        margin-bottom: 10px;
      }

      .icon-box i {
        font-size: 42px;
      }

      .contact-card h4 {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 5px;
      }

      .contact-card p {
        color: #555;
        font-size: 20px;
      }

      /* Section */
    .contact-section {
        max-width: 1100px;
        margin: 10px auto 60px auto;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 60px;
    }

    /* Left Title */
    .contact-title {
        flex: 1;
    }

    .contact-title h2 {
        text-align: center;
        font-size: 32px;
        font-weight: bold;
        position: relative;
    }

    .contact-title h2::before,
    .contact-title h2::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 30%;
        height: 1px;
        background: #999;
    }

    .contact-title h2::before {
        left: 0;
    }

    .contact-title h2::after {
        right: 0;
    }

    .contact-title span {
        background: #fff;
        padding: 0 12px;
        position: relative;
        z-index: 1;
    }

    /* Form Box */
    .contact-form {
        flex: 1;
        background: #e9f0fa;
        padding: 30px;
        border-radius: 12px;
    }

    .form-row {
        display: flex;
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 18px;
        flex: 1;
    }

    .contact-form label {
        margin-bottom: 6px;
        font-size: 16px;
        font-weight: 500;
    }

    .contact-form input,
    .contact-form textarea {
        padding: 10px;
        border: 1px solid #8cb3ea;
        border-radius: 6px;
        font-size: 15px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
    }

    .contact-form textarea {
        resize: vertical;
        min-height: 120px;
    }

    .contact-form button {
        background: #6f8fc7;
        color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    .contact-form button:hover {
        background: #5d7fbb;
    }

    /* =======================
      Responsive
      ======================= */
    @media (max-width: 768px) {

        /* Hide the left title */
        .contact-title {
            display: none;
        }

        /* Form takes full width */
        .contact-section {
            display: block;
            padding: 15px;
        }

        .contact-form {
            width: 100%;
            padding: 20px;
        }

        /* Stack Name and Phone */
        .form-row {
            flex-direction: column;
            gap: 0;
        }

        .contact-form button {
            width: 100%;
        }
    }
    </style>
  </head>

  <body>
    <!-- Navbar Component -->
    <div id="navbar"></div>

    <!-- Hero -->
    <section class="hero">
      <h1>Contact us</h1>
    </section>

    <div class="container pt-5 pb-0">
      <!-- Contact Info -->
      <div class="row text-center justify-content-center">
        <div class="col-6 col-md-4 mb-4">
          <div class="contact-card">
            <div class="icon-box">
              <i class="bi bi-envelope-fill"></i>
            </div>
            <h4>Email</h4>
            <p>justme@gmail.com</p>
          </div>
        </div>

        <div class="col-6 col-md-4 mb-4">
          <div class="contact-card">
            <div class="icon-box">
              <i class="bi bi-telephone-fill"></i>
            </div>
            <h4>Phone</h4>
            <p>+855 xxx xxx xxx</p>
          </div>
        </div>

        <div class="col-10 col-sm-8 col-md-4 mx-auto mb-4">
          <div class="contact-card">
            <div class="icon-box">
              <i class="bi bi-geo-alt-fill"></i>
            </div>
            <h4>Social</h4>
            <p>Phnom Penh</p>
          </div>
        </div>
      </div>
    </div>

    <div class="contact-section">
    <!-- Left Title -->
    <div class="contact-title">
        <h2><span>Contact us by here</span></h2>
    </div>

    <!-- Contact Form -->
    <div class="contact-form">
        <form>
            <div class="form-row">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text">
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea rows="5"></textarea>
            </div>

            <button type="submit">Send</button>
        </form>
    </div>
</div>

    <div id="footer"></div>

    <script>
      function loadComponent(url, elementId) {
        return fetch(url)
          .then((response) => response.text())
          .then((data) => {
            const container = document.getElementById(elementId);
            container.innerHTML = data;
            const scripts = container.querySelectorAll("script");
            scripts.forEach((oldScript) => {
              const newScript = document.createElement("script");
              Array.from(oldScript.attributes).forEach((attr) =>
                newScript.setAttribute(attr.name, attr.value)
              );
              newScript.appendChild(document.createTextNode(oldScript.innerHTML));
              oldScript.parentNode.replaceChild(newScript, oldScript);
            });
          });
      }

      loadComponent("../components/footer.html", "footer");
      loadComponent("../components/nav.html", "navbar");
    </script>
  </body>
</html>
