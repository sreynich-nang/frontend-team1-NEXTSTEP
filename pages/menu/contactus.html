<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Next Step</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      * {
        font-family: Arial, Helvetica, sans-serif;
      }

      /* Hero */
      .hero {
        height: 420px;
        background: url("../../assets/images/contact_background.png") center
          center/cover no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .hero h1 {
        color: white;
        font-size: 60px;
        font-weight: bold;
      }

      /* Contact Info */
      .contact-card {
        text-align: center;
      }

      .icon-box {
        width: 90px;
        height: 90px;
        border: 1px solid #999;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        margin-bottom: 10px;
      }

      .icon-box i {
        font-size: 42px;
      }

      .contact-card h4 {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 5px;
      }

      .contact-card p {
        color: #555;
        font-size: 20px;
      }
    </style>
  </head>

  <body>
    <!-- Navbar Component -->
    <div id="navbar"></div>

    <!-- Hero -->
    <section class="hero">
      <h1>Contact us</h1>
    </section>

    <div class="container py-5">
      <!-- Contact Info -->
      <div class="row text-center mb-5 justify-content-center">
        <div class="col-6 col-md-4 mb-4">
          <div class="contact-card">
            <div class="icon-box">
              <i class="bi bi-envelope-fill"></i>
            </div>
            <h4>Email</h4>
            <p>bothavy8@gmail.com</p>
          </div>
        </div>

        <div class="col-6 col-md-4 mb-4">
          <div class="contact-card">
            <div class="icon-box">
              <i class="bi bi-telephone-fill"></i>
            </div>
            <h4>Phone</h4>
            <p>+855 963 940 372</p>
          </div>
        </div>

        <div class="col-10 col-sm-8 col-md-4 mx-auto mb-4">
          <div class="contact-card">
            <div class="icon-box">
              <i class="bi bi-geo-alt-fill"></i>
            </div>
            <h4>Social</h4>
            <p>Phnom Penh</p>
          </div>
        </div>
      </div>
    </div>

    <div id="footer"></div>

    <script>
      function loadComponent(url, elementId) {
        fetch(url)
          .then((response) => response.text())
          .then((data) => {
            document.getElementById(elementId).innerHTML = data;
          });
      }

      loadComponent("../components/footer.html", "footer");
      loadComponent("../components/nav.html", "navbar");
    </script>
  </body>
</html>
