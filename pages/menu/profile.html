<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile | NextStep - Update Your Student Account</title>
  <meta name="description" content="Manage your NextStep profile. Update your user name, email, password, and profile picture.">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="List.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div id="navbar"></div>

  
  <div class="main-container">
    
    
    <aside class="sidebar">
      <button class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
      </button>

     
      <div class="profile-summary">
        <div class="avatar-wrapper">
          <img src="image/image.png" alt="Just Me profile avatar" class="avatar-img">
          <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>
        </div>
        <div class="profile-info">
          <p class="profile-name">Just Me</p>
          <p class="email-text">justme@gmail.com</p>
        </div>
      </div>

      
      <nav class="sidebar-menu">
        <a href="#" class="menu-item active"><i class="fa-regular fa-user"></i> Profile</a>
        <a href="#" class="menu-item"><i class="fa-regular fa-bookmark"></i> save stories</a>
        <a href="#" class="menu-item"><i class="fa-regular fa-circle-question"></i> Help</a>
        <a href="#" class="menu-item"><i class="fa-solid fa-gear"></i> Setting</a>
        <a href="../dashboardpages/dashboardpage.html" class="menu-item"><i class="fa-solid fa-chart-simple"></i> Dashboard</a>
        <a href="#" class="menu-item login-btn"><i class="fa-solid fa-right-from-bracket"></i> Log out</a>
      </nav>
    </aside>

   
    <main class="content-panel">
      <div class="edit-card">
        <h1 class="card-title">Edit information</h1>
        
        <!-- Inside Card Profile Upload -->
        <div class="card-profile-section">
          <div class="avatar-wrapper large">
            <img src="image/image.png" alt="Just Me profile avatar" class="avatar-img">
            <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>
          </div>
          <button class="edit-profile-btn">Save Change</button>
        </div>

       
        <form class="edit-form">
          <div class="form-group">
            <label for="username">User Name</label>
            <input type="text" id="username" value="Just Me">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" value="justme@gmail.com">
          </div>

          <div class="form-group password-group">
            <label for="password">Password</label>
            <input type="password" id="password" value="••••">
            <i class="fa-regular fa-eye-slash toggle-password"></i>
          </div>
        </form>
      </div>
    </main>

  </div>

  <script>
    function loadComponent(url, elementId) {
      return fetch(url)
        .then((response) => response.text())
        .then((data) => {
          const container = document.getElementById(elementId);
          container.innerHTML = data;
          const scripts = container.querySelectorAll("script");
          scripts.forEach((oldScript) => {
            const newScript = document.createElement("script");
            Array.from(oldScript.attributes).forEach((attr) =>
              newScript.setAttribute(attr.name, attr.value)
            );
            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            oldScript.parentNode.replaceChild(newScript, oldScript);
          });
        })
        .catch(err => console.log("Component load skip inside preview environment"));
    }

    loadComponent("../components/nav_no_search.html", "navbar");
  </script>
</body>
</html>
