<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile | NextStep - Update Your Student Account</title>
  <meta name="description" content="Manage your NextStep profile. Update your user name, email, password, and profile picture.">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="List.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="navbar">
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" class="search-input" placeholder="">
    </div>
    <div class="nav-right">
      <button class="menu-btn"><i class="fa-solid fa-bars"></i> Menu</button>
      <div class="user-avatar-nav">
        <i class="fa-regular fa-circle-user"></i>
      </div>
    </div>
  </header>

  
  <div class="main-container">
    
    
    <aside class="sidebar">
      <button class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
      </button>

     
      <div class="profile-summary">
        <div class="avatar-wrapper">
          <img src="image/image.png" alt="Keo Vicheat profile avatar" class="avatar-img">
          <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>
        </div>
        <div class="profile-info">
          <p class="profile-name">Keo Vicheat</p>
          <p class="email-text">keovicheat@gmail.com</p>
        </div>
      </div>

      
      <nav class="sidebar-menu">
        <a href="#" class="menu-item active"><i class="fa-regular fa-user"></i> Profile</a>
        <a href="#" class="menu-item"><i class="fa-regular fa-bookmark"></i> save stories</a>
        <a href="#" class="menu-item"><i class="fa-regular fa-circle-question"></i> Help</a>
        <a href="#" class="menu-item"><i class="fa-solid fa-gear"></i> Setting</a>
        <a href="#" class="menu-item"><i class="fa-solid fa-chart-simple"></i> Dashboard</a>
        <a href="#" class="menu-item login-btn"><i class="fa-solid fa-right-from-bracket"></i> Login</a>
      </nav>
    </aside>

   
    <main class="content-panel">
      <div class="edit-card">
        <h1 class="card-title">Edit information</h1>
        
        <!-- Inside Card Profile Upload -->
        <div class="card-profile-section">
          <div class="avatar-wrapper large">
            <img src="image/image.png" alt="Keo Vicheat profile avatar" class="avatar-img">
            <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>
          </div>
          <button class="edit-profile-btn">Edit profile</button>
        </div>

       
        <form class="edit-form">
          <div class="form-group">
            <label for="username">User Name</label>
            <input type="text" id="username" value="Keo Vicheat">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" value="keovicheat@gmail.com">
          </div>

          <div class="form-group password-group">
            <label for="password">Password</label>
            <input type="password" id="password" value="••••">
            <i class="fa-regular fa-eye-slash toggle-password"></i>
          </div>
        </form>
      </div>
    </main>

  </div>

</body>
</html>
