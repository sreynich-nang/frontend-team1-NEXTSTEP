<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      /* reset default margins & paddings */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* body styling */
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #eef3f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* main container */
      .auth-container {
        display: flex;
        width: 1100px;
        max-width: 100%;
        background: #ffffff;
        border-radius: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        min-height: 650px;
      }

      /* left side form */
      .form-side {
        flex: 0 0 55%;
        padding: 48px 44px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      /* heading text */
      .form-side h1 {
        font-size: 32px;
        color: #1e1e2f;
      }

      .form-side .sub-heading {
        font-size: 15px;
        color: #6b6b80;
        margin-top: 4px;
      }

      .form-side .welcome-text {
        font-size: 14px;
        color: #8a8aa0;
        margin-top: 18px;
      }

      /* labels & inputs */
      .form-side label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #2d2d44;
        margin-bottom: 6px;
        margin-top: 22px;
      }

      .form-side input[type="email"],
      .form-side input[type="password"] {
        width: 100%;
        padding: 14px 16px;
        border: 1.5px solid #dce1ea;
        border-radius: 14px;
        font-size: 15px;
        background: #fafbfc;
        outline: none;
        transition: 0.25s;
      }

      /* inputs focus states */
      .form-side input[type="email"]:focus,
      .form-side input[type="password"]:focus {
        border-color: #6f9bd0;
        box-shadow: 0 0 0 4px rgba(111, 155, 208, 0.15);
        background: #ffffff;
      }

      /* checkbox & links row */
      .row-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        flex-wrap: wrap;
        gap: 8px;
      }

      .row-options label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #3d3d5c;
        margin-top: 0;
        cursor: pointer;
      }

      .row-options input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #6f9bd0;
        cursor: pointer;
      }

      .row-options a {
        color: #6f9bd0;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }

      .row-options a:hover {
        text-decoration: underline;
        color: #4a7aa8;
      }

      /* login button */
      .btn-login {
        width: 100%;
        padding: 15px;
        margin-top: 22px;
        background: #6f9bd0;
        color: #ffffff;
        border: none;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.25s;
      }

      .btn-login:hover {
        background: #5a85b8;
      }

      /* signup text links */
      .signup {
        text-align: center;
        margin-top: 16px;
        font-size: 14px;
        color: #6b6b80;
      }

      .signup a {
        color: #6f9bd0;
        font-weight: 600;
        text-decoration: none;
      }

      .signup a:hover {
        text-decoration: underline;
      }

      /* divider element */
      .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 24px;
        color: #b0b0c8;
        font-size: 13px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #dce1ea;
      }



      /* right side layout styles */
      .image-side {
        flex: 1;
        background: #6f9bd0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 30px;
        position: relative;
      }

      /* gradient overlay to enhance visual look */
      .image-side::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          145deg,
          rgba(111, 155, 208, 0.92),
          rgba(68, 112, 163, 0.85)
        );
        z-index: 1;
      }

      .image-side .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: 100%;
        color: #ffffff;
      }

      /* logo layout */
      .image-side .logo-img {
        max-width: 180px;
        max-height: 90px;
        width: auto;
        height: auto;
        object-fit: contain;
        margin-bottom: 20px;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
      }

      /* biker illustration styling */
      .image-side .biker-img {
        width: 100%;
        max-width: 320px;
        height: auto;
        margin-top: 10px;
      }

      /* tagline text styles */
      .image-side .tagline {
        font-size: 18px;
        font-weight: 300;
        margin-top: 24px;
        line-height: 1.5;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      }

      .image-side .tagline strong {
        font-weight: 600;
      }

      /* responsive styling for small layouts */
      @media (max-width: 820px) {
        .auth-container {
          flex-direction: column;
          min-height: auto;
          border-radius: 24px;
        }

        .form-side {
          flex: 1 1 auto;
          padding: 36px 28px;
        }

        /* hide right column on mobile */
        .image-side {
          display: none;
        }

        .form-side h1 {
          font-size: 28px;
        }
      }

      /* extra small layout styling */
      @media (max-width: 480px) {
        .form-side {
          padding: 28px 18px;
        }

        .form-side h1 {
          font-size: 24px;
        }

        .row-options {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }

        .btn-login {
          padding: 14px;
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <!-- left form container -->
      <div class="form-side">
        <h1>Log in</h1>
        <p class="sub-heading">Login to your account to sharing your journey</p>
        <p class="welcome-text">Welcome back! Please login to your account.</p>

        <form action="#" method="post">
          <label for="email">Email</label>
          <input type="email" id="email" value="login@gmail.com" />

          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" />

          <div class="row-options">
            <label> <input type="checkbox" checked /> Remember Me </label>
            <a href="#">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-login">Login</button>
        </form>

        <p class="signup">Don't have an account? <a href="signup.html">Sign Up</a></p>

        <div class="divider">Or login with</div>

        <div class="d-flex gap-3 justify-content-center flex-wrap">
          <!-- Google -->
          <a href="#" class="btn btn-outline-secondary d-flex align-items-center px-4 py-2">
            <img
              src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
              alt="Google"
              width="20"
              height="20"
              class="me-2"
            >
            Google
          </a>

          <!-- Facebook -->
          <a href="#" class="btn btn-outline-primary d-flex align-items-center px-4 py-2">
            <i class="bi bi-facebook me-2 fs-5"></i>
            Facebook
          </a>
        </div>
      </div>

      <!-- right logo and biker visual -->
      <div class="image-side">
        <div class="content">
          <!-- logo -->
          <img
            src="../../assets/images/favicon_io/image.png"
            alt="Logo"
            class="logo-img"
          />
          <!-- biker image -->
          <img
            src="../../assets/images/biker_login.png"
            alt="Biker"
            class="biker-img"
          />
          <p class="tagline">
            <strong>Deliver</strong> your journey.<br />Share every mile.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
