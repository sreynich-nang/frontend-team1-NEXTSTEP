<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- font awesome for social icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      /* reset default margins & paddings */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* body styling */
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #eef3f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* main container */
      .container {
        display: flex;
        width: 1100px;
        max-width: 100%;
        background: #ffffff;
        border-radius: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        min-height: 650px;
      }

      /* left side form */
      .form-side {
        flex: 0 0 55%;
        padding: 48px 44px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      /* heading text */
      .form-side h1 {
        font-size: 32px;
        color: #1e1e2f;
      }

      .form-side .sub-heading {
        font-size: 15px;
        color: #6b6b80;
        margin-top: 4px;
      }

      .form-side .welcome-text {
        font-size: 14px;
        color: #8a8aa0;
        margin-top: 18px;
      }

      /* labels & inputs */
      .form-side label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #2d2d44;
        margin-bottom: 6px;
        margin-top: 22px;
      }

      .form-side input[type="email"],
      .form-side input[type="password"] {
        width: 100%;
        padding: 14px 16px;
        border: 1.5px solid #dce1ea;
        border-radius: 14px;
        font-size: 15px;
        background: #fafbfc;
        outline: none;
        transition: 0.25s;
      }

      /* inputs focus states */
      .form-side input[type="email"]:focus,
      .form-side input[type="password"]:focus {
        border-color: #6f9bd0;
        box-shadow: 0 0 0 4px rgba(111, 155, 208, 0.15);
        background: #ffffff;
      }

      /* checkbox & links row */
      .row-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        flex-wrap: wrap;
        gap: 8px;
      }

      .row-options label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #3d3d5c;
        margin-top: 0;
        cursor: pointer;
      }

      .row-options input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #6f9bd0;
        cursor: pointer;
      }

      .row-options a {
        color: #6f9bd0;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }

      .row-options a:hover {
        text-decoration: underline;
        color: #4a7aa8;
      }

      /* login button */
      .btn-login {
        width: 100%;
        padding: 15px;
        margin-top: 22px;
        background: #6f9bd0;
        color: #ffffff;
        border: none;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.25s;
      }

      .btn-login:hover {
        background: #5a85b8;
      }

      /* signup text links */
      .signup {
        text-align: center;
        margin-top: 16px;
        font-size: 14px;
        color: #6b6b80;
      }

      .signup a {
        color: #6f9bd0;
        font-weight: 600;
        text-decoration: none;
      }

      .signup a:hover {
        text-decoration: underline;
      }

      /* divider element */
      .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 24px;
        color: #b0b0c8;
        font-size: 13px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #dce1ea;
      }

      /* social buttons row */
      .social-row {
        display: flex;
        gap: 14px;
        margin-top: 16px;
      }

      .social-row a {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 13px 0;
        border: 1.5px solid #dce1ea;
        border-radius: 14px;
        background: #fafbfc;
        font-size: 14px;
        font-weight: 500;
        color: #2d2d44;
        text-decoration: none;
        transition: 0.2s;
      }

      .social-row a:hover {
        background: #ffffff;
        border-color: #b8c4d8;
      }

      /* right side layout styles */
      .image-side {
        flex: 1;
        background: #6f9bd0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 30px;
        position: relative;
      }

      /* gradient overlay to enhance visual look */
      .image-side::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          145deg,
          rgba(111, 155, 208, 0.92),
          rgba(68, 112, 163, 0.85)
        );
        z-index: 1;
      }

      .image-side .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: 100%;
        color: #ffffff;
      }

      /* logo layout */
      .image-side .logo-img {
        width: 90px;
        height: 90px;
        object-fit: contain;
        margin-bottom: 20px;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
      }

      /* biker illustration styling */
      .image-side .biker-img {
        width: 100%;
        max-width: 320px;
        height: auto;
        margin-top: 10px;
      }

      /* tagline text styles */
      .image-side .tagline {
        font-size: 18px;
        font-weight: 300;
        margin-top: 24px;
        line-height: 1.5;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      }

      .image-side .tagline strong {
        font-weight: 600;
      }

      /* responsive styling for small layouts */
      @media (max-width: 820px) {
        .container {
          flex-direction: column;
          min-height: auto;
          border-radius: 24px;
        }

        .form-side {
          flex: 1 1 auto;
          padding: 36px 28px;
        }

        /* hide right column on mobile */
        .image-side {
          display: none;
        }

        .form-side h1 {
          font-size: 28px;
        }

        .social-row {
          flex-direction: column;
        }

        .social-row a {
          padding: 12px 0;
        }
      }

      /* extra small layout styling */
      @media (max-width: 480px) {
        .form-side {
          padding: 28px 18px;
        }

        .form-side h1 {
          font-size: 24px;
        }

        .row-options {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }

        .btn-login {
          padding: 14px;
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- left form container -->
      <div class="form-side">
        <h1>Log in</h1>
        <p class="sub-heading">Login to your account to sharing your journey</p>
        <p class="welcome-text">Welcome back! Please login to your account.</p>

        <form action="#" method="post">
          <label for="email">Email</label>
          <input type="email" id="email" value="login@gmail.com" />

          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" />

          <div class="row-options">
            <label> <input type="checkbox" checked /> Remember Me </label>
            <a href="#">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-login">Login</button>
        </form>

        <p class="signup">Don't have an account? <a href="#">Sign Up</a></p>

        <div class="divider">Or login with</div>

        <div class="social-row">
          <a href="#" class="google">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 48 48"
            >
              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
              />
              <path
                fill="#4285F4"
                d="M46.5 24c0-1.61-.15-3.16-.42-4.69H24v8.89h12.66c-.55 2.92-2.2 5.39-4.69 7.05v5.86h7.59c4.43-4.08 6.94-10.1 6.94-17.11z"
              />
              <path
                fill="#FBBC05"
                d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"
              />
              <path
                fill="#34A853"
                d="M24 48c6.48 0 11.91-2.15 15.89-5.85l-7.59-5.86c-2.12 1.42-4.84 2.27-8.3 2.27-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
              />
              <path fill="none" d="M0 0h48v48H0z" />
            </svg>
            Google
          </a>
          <a href="#" class="facebook">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
            >
              <path
                fill="#1877F2"
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
              />
            </svg>
            Facebook
          </a>
        </div>
      </div>

      <!-- right logo and biker visual -->
      <div class="image-side">
        <div class="content">
          <!-- logo -->
          <img
            src="../../assets/images/favicon_io/image.png"
            alt="Logo"
            class="logo-img"
          />
          <!-- biker image -->
          <img
            src="../../assets/images/biker_login.png"
            alt="Biker"
            class="biker-img"
          />
          <p class="tagline">
            <strong>Deliver</strong> your journey.<br />Share every mile.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
