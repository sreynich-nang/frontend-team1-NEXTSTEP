<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITC Workbench</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/writerblogs.css" />
  </head>

  <body>
    <nav class="navbar navbar-light bg-white border-bottom sticky-top">
      <div class="container-fluid">
        <!-- Menu in meduim & small size -->
        <button
          class="btn d-lg-none"
          data-bs-toggle="offcanvas"
          data-bs-target="#mobileSidebar"
        >
          <i class="bi bi-list fs-3"></i>
        </button>
        <span class="navbar-brand fw-semibold">
          My University Life at ITC
        </span>
        <i class="bi bi-person-circle fs-4"></i>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <!-- Desktop sidebar: 3/12 columns on large screens -->

        <aside class="col-lg-3 bg-white border-end d-none d-lg-block sidebar">
          <div class="p-3">
            <small class="text-muted"> Modern Academic </small>
            <hr />
            <div class="list-group">
              <a class="list-group-item"> Story Inventory </a>
              <a class="list-group-item active"> Narrative Timeline </a>
              <a class="list-group-item"> Reflection </a>
            </div>
          </div>
        </aside>

        <!-- Mobile Sidebar -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar">
          <div class="offcanvas-header">
            <button class="btn-close" data-bs-dismiss="offcanvas"></button>
          </div>

          <div class="offcanvas-body">
            <div class="list-group">
              <a class="list-group-item"> Story Inventory </a>
              <a class="list-group-item active"> Narrative Timeline </a>
              <a class="list-group-item"> Reflection </a>
            </div>
          </div>
        </div>

        <!-- Main Content Area: 9/12 columns on large screens -->
        <main class="col-lg-9 py-4">
          <div class="container">
            <!-- Page Header -->
            <section class="mb-5">
              <h1>Phase 2 : Timeline Configuration</h1>
              <p class="text-muted">Welcome to the Workbench.</p>
              <hr />
            </section>

            <template id="year-template">
              <div class="year">
                <h3 class="year-title"></h3>
                <div class="form-group">
                  <label>Title</label>
                  <input type="text" placeholder="Enter title" />
                </div>

                <div class="form-group">
                  <label>Start Date</label>
                  <input type="date" />
                </div>

                <div class="form-group">
                  <label>End Date</label>
                  <input type="date" />
                </div>

                <div class="form-group">
                  <label>Description</label>
                  <textarea
                    rows="4"
                    placeholder="Write description..."
                  ></textarea>
                </div>

                <div class="form-group">
                  <label>Upload Image / PDF</label>
                  <input type="file" accept="image/*,.pdf" />
                </div>

                <div class="form-group">
                  <label>Year Link</label>
                  <input type="url" placeholder="https://example.com" />
                </div>
              </div>
            </template>

            <!-- Year Container & Controls -->
            <div class="mb-5">
              <div id="year-container"></div>
              <button id="add-year" class="btn btn-primary mt-3">
                <i class="bi bi-plus-circle me-1"></i> Add Year
              </button>
              <button id="save-progress" class="btn btn-success mt-3 ms-2">
                <i class="bi bi-floppy me-1"></i> Save Progress
              </button>
            </div>

          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../../assets/js/writerpage.js"></script>
  </body>
</html>
