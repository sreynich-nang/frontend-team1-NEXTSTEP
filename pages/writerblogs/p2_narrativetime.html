<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITC Workbench - Phase 2: Narrative Timeline | NextStep</title>
    <meta name="description" content="NextStep Writer Workbench. Create and configure your narrative timeline. Add academic years, milestones, and descriptions.">

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/writerblogs.css" />
  </head>

  <body>
    <nav class="navbar navbar-light bg-white border-bottom sticky-top">
      <div class="container-fluid">
        <!-- Menu in meduim & small size -->
        <button
          class="btn d-lg-none"
          data-bs-toggle="offcanvas"
          data-bs-target="#mobileSidebar"
        >
          <i class="bi bi-list fs-3"></i>
        </button>
        <span class="d-inline-flex align-items-center me-3">
          <span class="navbar-brand fw-semibold me-0" contenteditable="true" id="editable-title" style="outline: none; border-bottom: 1px dashed #ced4da; cursor: text;" title="Click to edit title">
            My University Life at ITC
          </span>
          <i class="bi bi-pencil-fill ms-1" style="font-size: 0.8rem; cursor: pointer; color: var(--primary-hover);" title="Click title to edit"></i>
        </span>
        <i class="bi bi-person-circle fs-4"></i>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <!-- Desktop sidebar: 3/12 columns on large screens -->

        <aside class="col-lg-3 bg-white border-end d-none d-lg-block sidebar">
          <div class="p-3">
            <h5 class="fw-bold mb-1">Workbench</h5>
            <small class="text-muted"> Modern Academic </small>
            <hr />
            <div class="list-group">
              <a href="p1_storyinventory.html" class="list-group-item">
                <span class="material-symbols-outlined" style="font-size: 20px; vertical-align: middle;">inventory_2</span> Story Inventory
              </a>
              <a href="p2_narrativetime.html" class="list-group-item active">
                <span class="material-symbols-outlined" style="font-size: 20px; vertical-align: middle;">chronic</span> Narrative Timeline
              </a>
              <a href="p3_reflection.html" class="list-group-item">
                <span class="material-symbols-outlined" style="font-size: 20px; vertical-align: middle;">wand_stars</span> Reflection
              </a>
            </div>
          </div>
        </aside>

        <!-- Mobile Sidebar -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar">
          <div class="offcanvas-header">
            <button class="btn-close" data-bs-dismiss="offcanvas"></button>
          </div>

          <div class="offcanvas-body">
            <div class="list-group">
              <a href="p1_storyinventory.html" class="list-group-item">
                <span class="material-symbols-outlined" style="font-size: 20px; vertical-align: middle;">inventory_2</span> Story Inventory
              </a>
              <a href="p2_narrativetime.html" class="list-group-item active">
                <span class="material-symbols-outlined" style="font-size: 20px; vertical-align: middle;">chronic</span> Narrative Timeline
              </a>
              <a href="p3_reflection.html" class="list-group-item">
                <span class="material-symbols-outlined" style="font-size: 20px; vertical-align: middle;">wand_stars</span> Reflection
              </a>
            </div>
          </div>
        </div>

        <!-- Main Content Area: 9/12 columns on large screens -->
        <main class="col-lg-9 py-4">
          <div class="container">
            <!-- Page Header -->
            <section class="mb-5">
              <div class="d-inline-flex align-items-center">
                <h1 class="me-0 mb-0" contenteditable="true" id="editable-page-header" style="outline: none; border-bottom: 1px dashed #ced4da; cursor: text;" title="Click to edit title">Phase 2 : Timeline Configuration</h1>
                <i class="bi bi-pencil-fill ms-2" style="font-size: 1rem; cursor: pointer; color: var(--primary-hover);" title="Click title to edit"></i>
              </div>
              <p class="text-muted">Welcome to the Workbench.</p>
              <hr />
            </section>

            <template id="year-template">
              <div class="year">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="d-inline-flex align-items-center">
                    <h2 class="year-title fs-4 me-0 mb-0" contenteditable="true" style="outline: none; border-bottom: 1px dashed #ced4da; cursor: text;" title="Click to edit"></h2>
                    <i class="bi bi-pencil-fill ms-2" style="font-size: 0.9rem; cursor: pointer; color: var(--primary-hover);" title="Click to edit"></i>
                  </div>
                  <button type="button" class="btn btn-outline-danger btn-sm delete-year-btn">
                    <i class="bi bi-trash"></i> Delete
                  </button>
                </div>
                <div class="row">
                  <div class="col-lg-6 mb-3">
                    <div class="form-group mb-0">
                      <label>Title</label>
                      <input type="text" placeholder="Enter title" />
                    </div>
                  </div>
                  <div class="col-lg-6 mb-3">
                    <div class="form-group mb-0">
                      <label>Date Range</label>
                      <div class="d-flex align-items-center gap-2 flex-wrap flex-sm-nowrap">
                        <input type="date" style="flex: 1; min-width: 120px;" placeholder="Start Date" />
                        <span class="text-muted">to</span>
                        <input type="date" style="flex: 1; min-width: 120px;" placeholder="End Date" />
                      </div>
                    </div>
                  </div>
                </div>

                <div class="form-group">
                  <label>Key Reflections</label>
                  <textarea
                    rows="4"
                    placeholder="Describe the most significant academic or personal growth moments during this period"
                  ></textarea>
                </div>

                <!-- Attachments Component Placeholder -->
                <div class="attachments-placeholder"></div>
              </div>
            </template>

            <!-- Year Container & Controls -->
            <div class="mb-5">
              <div id="year-container"></div>
              <button id="add-year" class="btn btn-outline-primary mt-3">
                <i class="bi bi-plus-circle me-1"></i> Add Year
              </button>
              <button id="save-progress" class="btn btn-primary mt-3 ms-2">
                <i class="bi bi-floppy me-1"></i> Save Progress
              </button>
            </div>

          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../../assets/js/writerpage.js"></script>
  </body>
</html>
