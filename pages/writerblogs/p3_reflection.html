<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITC Workbench - Phase 3: Identity Reflection | NextStep</title>
    <meta name="description" content="NextStep Writer Workbench. Write and reflect on your personal transformation. Document your growth from foundation to graduation.">

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/writerblogs.css" />
  </head>

  <body>
    <nav class="navbar navbar-light bg-white border-bottom sticky-top">
      <div class="container-fluid">
        <!-- Menu in meduim & small size -->
        <button
          class="btn d-lg-none"
          data-bs-toggle="offcanvas"
          data-bs-target="#mobileSidebar"
        >
          <i class="bi bi-list fs-3"></i>
        </button>
        <span class="navbar-brand fw-semibold">
          My University Life at ITC
        </span>
        <i class="bi bi-person-circle fs-4"></i>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
<!-- Desktop sidebar: 3/12 columns on large screens -->

        <aside class="col-lg-3 bg-white border-end d-none d-lg-block sidebar">
          <div class="p-3">
            <small class="text-muted"> Modern Academic </small>
            <hr />
            <div class="list-group">
              <a href="p1_storyinventory.html" class="list-group-item"> Story Inventory </a>
              <a href="p2_narrativetime.html" class="list-group-item"> Narrative Timeline </a>
              <a href="p3_reflection.html" class="list-group-item active"> Reflection </a>
            </div>
          </div>
        </aside>

        <!-- Mobile Sidebar -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar">
          <div class="offcanvas-header">
            <button class="btn-close" data-bs-dismiss="offcanvas"></button>
          </div>

          <div class="offcanvas-body">
            <div class="list-group">
              <a href="p1_storyinventory.html" class="list-group-item"> Story Inventory </a>
              <a href="p2_narrativetime.html" class="list-group-item"> Narrative Timeline </a>
              <a href="p3_reflection.html" class="list-group-item active"> Reflection </a>
            </div>
          </div>
        </div>

<!-- Main Content Area: 9/12 columns on large screens -->
        <main class="col-lg-9 py-4">
          <div class="container">

            <!-- Page Header -->
            <section class="mb-5">
              <h1>Phase 3 : Identity Transformation</h1>
              <p class="text-muted">Welcome to the Workbench.</p>
              <hr />
            </section>

<!-- 1. the mirror of transformation -->
            <section class="container my-5">

                <h2 class="text-left mb-4">
                    The Mirror of Transformation
                </h2>

                <div class="row">
                    <div class="col-lg-6 mb-3">
                        <form class="border border-primary p-3 rounded">
                            <h3>Before</h3>
                            <label for="before">
                                Write your description here
                            </label>
                            <textarea
                                id="before"
                                class="form-control"
                                rows="6">
                            </textarea>
                        </form>
                    </div>

                    <div class="col-lg-6 mb-3">
                        <form class="border border-primary p-3 rounded">
                            <h3>After</h3>
                            <label for="after">
                                Write your description here
                            </label>
                            <textarea
                                id="after"
                                class="form-control"
                                rows="6">
                            </textarea>
                        </form>
                    </div>
                </div>
            </section>

<!-- 2. closing reflection -->
            <section>
                <h2 class="text-left mb-4">
                    Closing Reflection
                </h2>
                <label for="before">
                    Write your description here
                </label>
                <textarea
                    id="before"
                    class="form-control"
                    rows="6">
                </textarea>
            </section>

          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../../assets/js/writerpage.js"></script>
  </body>
</html>
