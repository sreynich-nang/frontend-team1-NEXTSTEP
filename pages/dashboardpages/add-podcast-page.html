<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Podcast</title>

<style>
/* Reset and Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 20px;
}

/* Back Arrow Styling */
.back-arrow {
    position: absolute;
    top: 40px;
    left: 40px;
    color: #000000;
    text-decoration: none;
    transition: transform 0.2s ease;
}

.back-arrow:hover {
    transform: translateX(-4px);
}

/* Layout Container */
.content-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 600px;
    width: 100%;
}

/* Illustration Configuration */
.illustration-wrapper {
    margin-bottom: 24px;
    width: 100%;
    max-width: 450px; /* Controls maximum size of the graphic */
}

.illustration-img {
    width: 100%;
    height: auto;
    display: block;
}

/* Typography */
.coming-soon-text {
    font-size: 2.75rem;
    font-weight: 700;
    color: #6697d4; /* Matching the muted blue text color */
    margin-bottom: 40px;
    letter-spacing: -0.5px;
}

/* Button Styling */
.btn-home {
    display: inline-block;
    background-color: #6697d4; /* Matching button blue background */
    color: #ffffff;
    font-size: 1.1rem;
    font-weight: 600;
    text-decoration: none;
    padding: 14px 44px;
    border-radius: 12px; /* Smooth rounded corners */
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    transition: background-color 0.2s ease, transform 0.1s ease;
}

.btn-home:hover {
    background-color: #5585c2;
}

.btn-home:active {
    transform: scale(0.98);
}

/* Responsive adjustments for smaller screens */
@media (max-width: 480px) {
    .back-arrow {
        top: 20px;
        left: 20px;
    }
    
    .coming-soon-text {
        font-size: 2rem;
        margin-bottom: 30px;
    }
    
    .btn-home {
        width: 100%; /* Full width button on small mobile views */
        padding: 14px 0;
    }
}
    </style>

</head>
<body>

    <a href="#" class="back-arrow" aria-label="Go back">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
            <path d="M7.828 11H20v2H7.828l5.364 5.364-1.414 1.414L4 12l7.778-7.778 1.414 1.414z"/>
        </svg>
    </a>

    <main class="content-container">
        <div class="illustration-wrapper">
            <img src="../../assets/images/podcast.png" alt="Development illustration" class="illustration-img">
        </div>

        <h1 class="coming-soon-text">Coming soon...</h1>

        <a href="#" class="btn-home">Back Home</a>
    </main>

</body>
</html>
